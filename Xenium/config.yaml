# Project paths and file-naming conventions.
# All paths are relative to the repo root. Do not put machine-specific
# absolute paths here — those go in config.local.yaml (gitignored).

paths:
  data:        data
  raw:         data/raw
  metadata:    data/metadata
  annotations: data/annotations

  interim:
    adata: data/interim/adata
    sdata: data/interim/sdata

  processed:
    adata:
      root:          data/processed/adata
      all_cells:     data/processed/adata/all_cells
      nonepithelial: data/processed/adata/nonepithelial
      immune:        data/processed/adata/nonepithelial/immune
      stromal:       data/processed/adata/nonepithelial/stromal
      epithelial:    data/processed/adata/epithelial
      tcells:        data/processed/adata/tcells

  results:
    figures:         results/figures
    tables:          results/tables
    xenium_explorer: results/xenium-explorer-csvs

# File-naming templates. {key} = slide key (A1, A2, ...).
filenames:
  filtered_adata:            "filtered_xenium_{key}.h5ad"
  filtered_normalized_adata: "filtered_normalized_xenium_{key}.h5ad"
  filtered_sdata:            "filtered_xenium_{key}.zarr"
  combined_adata:            "combined_filtered_normalized_xenium.h5ad"
  all_cells_final:           "all_cells_final_anno.h5ad"
  all_cells_morans:          "all_cells_spatial_morans_annotated.h5ad"
